project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!cv/"
  resources:
    - CNAME
    - images/academicons-1.9.4/
    - cv/*.pdf
    # Self-contained static page, copied verbatim (never rendered by Quarto).
    # Deliberately unlisted: no navbar entry, no link from any page, and it stays
    # out of sitemap.xml/search.json because only rendered .qmd pages go in those.
    - apps/practice/
    # Kita bake-sale sign-up, same pattern: unlisted, shared only by e-mail link.
    # Temporary: remove this line and the folder after the event (2026-11-24).
    - apps/babar-kuchen/

website:
  title: "Gidon Frischkorn"
  description: "Cognitive psychologist at the University of Zurich working on psychological measurement: Bayesian hierarchical measurement models (bmm), the validity of cognitive measures, and individual differences in working memory and attention."
  image: images/social-card.jpg
  image-alt: "Gidon Frischkorn, cognitive psychology and psychometrics, University of Zurich"
  favicon: images/favicon.png
  site-url: https://www.gfrischkorn.org
  open-graph:
    locale: en_US
    site-name: "Gidon Frischkorn"
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: software.qmd
        text: Software
      - href: blog.qmd
        text: Blog
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/GidonFrischkorn
        aria-label: GitHub
      - icon: orcid
        href: https://orcid.org/0000-0002-5055-9764
        aria-label: ORCID
      - icon: google-scholar
        href: "https://scholar.google.com/citations?user=gpol3F4AAAAJ&hl=en"
        aria-label: Google Scholar
      - icon: bluesky
        href: https://bsky.app/profile/gidon-frischkorn.bsky.social
        aria-label: Bluesky
        rel: me
      - icon: linkedin
        href: https://www.linkedin.com/in/gidon-frischkorn-4913431b1/
        aria-label: LinkedIn
      - icon: rss
        href: blog.xml
        aria-label: RSS feed
  page-footer:
    center: "© 2026 Gidon Frischkorn"
    right: "[RSS](blog.xml)"
  back-to-top-navigation: false

format:
  html:
    theme:
      light: [cosmo, theme-light.scss, custom.scss]
      dark:  [cosmo, theme-dark.scss, custom.scss]
    canonical-url: true
    include-in-header:
      - text: |
          <link rel="stylesheet" href="/images/academicons-1.9.4/css/academicons.min.css">
      - text: |
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Person",
            "@id": "https://www.gfrischkorn.org/#person",
            "name": "Gidon T. Frischkorn",
            "givenName": "Gidon",
            "familyName": "Frischkorn",
            "honorificPrefix": "Dr.",
            "jobTitle": "SNF Ambizione Fellow",
            "url": "https://www.gfrischkorn.org/",
            "image": "https://www.gfrischkorn.org/images/Frischkorn_Gidon_small.jpg",
            "email": "mailto:gidon.frischkorn@psychologie.uzh.ch",
            "affiliation": {
              "@type": "Organization",
              "name": "University of Zurich",
              "department": "Department of Psychology, Cognitive Psychology Lab",
              "url": "https://www.psychology.uzh.ch/en/areas/nec/allgpsy.html"
            },
            "alumniOf": { "@type": "CollegeOrUniversity", "name": "Heidelberg University" },
            "knowsAbout": [
              "Psychological measurement", "Cognitive psychometrics",
              "Bayesian hierarchical measurement models", "Working memory",
              "Individual differences in cognition", "Computational modeling"
            ],
            "sameAs": [
              "https://orcid.org/0000-0002-5055-9764",
              "https://scholar.google.com/citations?user=gpol3F4AAAAJ",
              "https://github.com/GidonFrischkorn",
              "https://bsky.app/profile/gidon-frischkorn.bsky.social",
              "https://www.linkedin.com/in/gidon-frischkorn-4913431b1/"
            ]
          }
          </script>
    toc: false
    link-external-icon: false
    link-external-newwindow: true

execute:
  freeze: auto
