<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Nur eigene Dateien; Netzwerkzugriff ausschliesslich auf das Apps-Script-Backend
     (script.google.com leitet auf script.googleusercontent.com weiter). Damit sind
     externe Schriften, CDNs und Tracker technisch ausgeschlossen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Kuchenverkauf · Chinderhuus BABAR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<div class="wrap">

  <div class="notice demo" id="demoBanner" hidden></div>

  <!-- Sprachauswahl: Weltkugel als sprachunabhängiges Zeichen, Namen in der jeweiligen Sprache. -->
  <div class="langs">
    <label for="lang" class="lang-label">
      <svg class="globe" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"
           fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="9.2"/>
        <path d="M2.8 12h18.4M12 2.8c2.6 2.5 3.9 5.6 3.9 9.2s-1.3 6.7-3.9 9.2c-2.6-2.5-3.9-5.6-3.9-9.2s1.3-6.7 3.9-9.2z"/>
      </svg>
      <span class="sr-only" data-i18n="lang_label">Sprache</span>
    </label>
    <select id="lang" name="lang" autocomplete="off"></select>
  </div>

  <header class="head">
    <p class="org" id="org">Chinderhuus BABAR</p>
    <h1 id="title">Kuchenverkauf</h1>
    <p class="date" id="date"></p>
    <p class="intro" data-i18n="intro"></p>
  </header>

  <main>
    <section class="card" aria-labelledby="overviewH">
      <h2 id="overviewH" data-i18n="overview_h"></h2>
      <p class="status" id="overviewStatus" role="status"></p>
      <h3 class="sub-h" id="byCatH" data-i18n="overview_by_cat" hidden></h3>
      <ul class="bars" id="bars" aria-labelledby="byCatH" hidden></ul>
      <div id="ingBlock" hidden>
        <h3 class="sub-h" id="byIngH" data-i18n="overview_by_ing"></h3>
        <ul class="chips" id="ingCounts" aria-labelledby="byIngH"></ul>
        <p class="ing-none" id="ingNone" data-i18n="ing_none" hidden></p>
      </div>
      <p class="mark-legend" id="markLegend" hidden></p>
      <p class="total" id="total" hidden></p>
      <p class="error" id="overviewError" hidden>
        <span id="overviewErrorText"></span>
        <button type="button" class="btn secondary" id="retry" data-i18n="retry"></button>
      </p>
    </section>

    <section class="card" aria-labelledby="formH" id="formCard">
      <h2 id="formH" data-i18n="form_h"></h2>

      <p class="notice off" id="notConfigured" hidden data-i18n="not_configured"></p>

      <form id="form" novalidate>
        <div class="tip" role="note" aria-labelledby="tipH">
          <p class="tip-h" id="tipH" data-i18n="tip_h"></p>
          <p data-i18n="tip_text"></p>
        </div>

        <div class="name-row">
          <div class="field">
            <label for="firstName">
              <span data-i18n="first_label"></span>
              <span class="req" aria-hidden="true">*</span>
              <span class="sr-only" data-i18n="required"></span>
            </label>
            <input type="text" id="firstName" name="firstName" autocomplete="off" dir="auto" required
                   aria-describedby="nameHint firstErr">
            <p class="field-error" id="firstErr" hidden></p>
          </div>
          <div class="field">
            <label for="lastName">
              <span data-i18n="last_label"></span>
              <span class="req" aria-hidden="true">*</span>
              <span class="sr-only" data-i18n="required"></span>
            </label>
            <input type="text" id="lastName" name="lastName" autocomplete="off" dir="auto" required
                   aria-describedby="nameHint lastErr">
            <p class="field-error" id="lastErr" hidden></p>
          </div>
        </div>
        <p class="hint name-hint" id="nameHint" data-i18n="name_hint"></p>

        <div class="field">
          <label for="category">
            <span data-i18n="cat_label"></span>
            <span class="req" aria-hidden="true">*</span>
            <span class="sr-only" data-i18n="required"></span>
          </label>
          <select id="category" name="category" required aria-describedby="catHint catErr"></select>
          <p class="many-hint" id="catHint" aria-live="polite"></p>
          <p class="field-error" id="catErr" hidden></p>
        </div>

        <!-- Nur sichtbar, wenn die Art «Sonstiges» gewählt ist. -->
        <div class="field" id="otherField" hidden>
          <label for="otherName" data-i18n="other_label"></label>
          <input type="text" id="otherName" name="otherName" autocomplete="off" dir="auto"
                 aria-describedby="otherHint otherErr">
          <p class="hint" id="otherHint" data-i18n="other_hint"></p>
          <p class="field-error" id="otherErr" hidden></p>
        </div>

        <fieldset class="field ings" id="algField" aria-describedby="algHint">
          <legend data-i18n="alg_legend"></legend>
          <p class="hint" id="algHint" data-i18n="alg_hint"></p>
          <div class="ing-grid" id="algGrid"></div>
        </fieldset>

        <fieldset class="field ings" id="ingField" aria-describedby="ingHint ingManyHint ingNutNote ingErr">
          <legend data-i18n="ing_legend"></legend>
          <p class="hint" id="ingHint"></p>
          <div class="ing-grid" id="ingGrid"></div>
          <p class="many-hint" id="ingNutNote" aria-live="polite"></p>
          <p class="many-hint" id="ingManyHint" aria-live="polite"></p>
          <p class="field-error" id="ingErr" hidden></p>
        </fieldset>

        <div class="field">
          <label for="description" data-i18n="desc_label"></label>
          <p class="many-hint above" id="descOtherNote" aria-live="polite"></p>
          <textarea id="description" name="description" rows="2" dir="auto"
                    aria-describedby="descOtherNote descHint descCount descErr"></textarea>
          <p class="hint">
            <span id="descHint" data-i18n="desc_hint"></span>
            <span class="count" id="descCount"></span>
          </p>
          <p class="field-error" id="descErr" hidden></p>
        </div>

        <!-- Honeypot gegen Spam-Bots: für Menschen unsichtbar und nicht erreichbar. -->
        <div class="hp" aria-hidden="true">
          <label for="website" data-i18n="hp_label"></label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <p class="error" id="submitError" role="alert" hidden></p>

        <button type="submit" class="btn primary" id="submit">
          <span id="submitText" data-i18n="submit"></span>
        </button>
        <p class="status" id="submitStatus" role="status"></p>
      </form>

      <div class="success" id="success" hidden>
        <h3 id="successH" tabindex="-1" data-i18n="success_h"></h3>
        <p id="successText"></p>
        <button type="button" class="btn secondary" id="again" data-i18n="again"></button>
      </div>
    </section>

    <section class="card" id="descCard" aria-labelledby="descH" hidden>
      <h2 id="descH" data-i18n="descriptions_h"></h2>
      <div id="descList"></div>
    </section>

    <section class="privacy" aria-labelledby="privacyH">
      <h2 id="privacyH" data-i18n="privacy_h"></h2>
      <p data-i18n="privacy_p1"></p>
      <p data-i18n="privacy_p2"></p>
    </section>
  </main>

  <noscript>
    <p class="notice off">Diese Seite braucht JavaScript. / This page needs JavaScript.</p>
  </noscript>
</div>

<script src="config.js"></script>
<script src="i18n-de.js"></script>
<script src="i18n-sq.js"></script>
<script src="i18n-am.js"></script>
<script src="i18n-ar.js"></script>
<script src="i18n-zh.js"></script>
<script src="i18n-en.js"></script>
<script src="i18n-el.js"></script>
<script src="i18n-ku.js"></script>
<script src="i18n-mn.js"></script>
<script src="i18n-fa.js"></script>
<script src="i18n-so.js"></script>
<script src="i18n-es.js"></script>
<script src="i18n-th.js"></script>
<script src="i18n-ti.js"></script>
<script src="i18n-tr.js"></script>
<script src="i18n-vi.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
