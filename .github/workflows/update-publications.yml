name: Update Publications

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of each month at 06:00 UTC
  workflow_dispatch:       # also triggerable manually from the Actions tab

permissions:
  contents: write          # needed to commit and push updated files

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true   # use pre-compiled binaries for fast installs

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          # Key on the actual R version so a new R release never restores a
          # library built for the previous one.
          key: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-publications-${{ hashFiles('.github/workflows/update-publications.yml') }}
          restore-keys: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-publications-

      - name: Install R packages
        # jsonlite is only a Suggests of httr2, but resp_body_json() needs it.
        run: install.packages(c("httr2", "jsonlite", "stringr", "purrr", "yaml"))
        shell: Rscript {0}

      - name: Run publications update script
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ vars.ZOTERO_USER_ID }}
        run: Rscript scripts/update_publications.R

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.qmd cv/data/publications.yml
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: auto-update publications from Zotero + OpenAlex"
            git push
          fi
