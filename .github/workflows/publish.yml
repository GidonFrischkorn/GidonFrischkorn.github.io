name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so CI renders with the same Typst as the local machine.
          # Unpinned, this tracks the latest release and the CV layout drifts
          # away from the locally previewed version. Bump together with the
          # local install.
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("yaml", "knitr", "rmarkdown"))'

      - name: Render site
        run: quarto render

      - name: Render CV PDFs
        run: cd cv && quarto render

      # The practice page is an unlisted static file copied through by the
      # `resources:` key in _quarto.yml. Nothing links to it, so if that entry
      # is ever dropped the build still succeeds and the URL just starts
      # returning 404 with no other symptom. Equally, if it ever got pulled
      # into `render:` it would silently enter the sitemap and search index and
      # stop being unlisted. Assert both directions here.
      - name: Check the unlisted practice page shipped correctly
        run: |
          set -euo pipefail

          # Every file under apps/practice/ must ship, byte-identical, and
          # nothing extra may appear. The pages are split across several files
          # (shared engine, per-page scripts); a missing sibling gives a blank
          # or unstyled page rather than an obvious error.
          if [ ! -d _site/apps/practice ]; then
            echo "::error::_site/apps/practice is missing. Is the 'apps/practice/' entry still under project.resources in _quarto.yml?"
            exit 1
          fi
          if ! diff -rq apps/practice _site/apps/practice; then
            echo "::error::apps/practice and _site/apps/practice differ. Every file must be copied verbatim, never rendered by Quarto."
            exit 1
          fi
          n_files=$(find apps/practice -type f | wc -l | tr -d ' ')

          # A page is useless if it stops referencing its siblings: every local
          # href/src in every HTML file must name a file that exists.
          for page in apps/practice/*.html; do
            for ref in $(grep -o -E '(href|src)="[^"/:]+"' "$page" | sed -E 's/^(href|src)="//; s/"$//' | sed 's/[?#].*//'); do
              if [ ! -f "apps/practice/$ref" ]; then
                echo "::error::$page references $ref, which does not exist in apps/practice/"
                exit 1
              fi
            done
          done
          for index in sitemap.xml search.json; do
            if [ -f "_site/$index" ] && grep -q "apps/practice" "_site/$index"; then
              echo "::error::apps/practice appears in _site/$index. This page is meant to stay unlisted."
              exit 1
            fi
          done
          echo "practice pages: all $n_files files present, byte-identical to source, cross-referenced, absent from sitemap.xml and search.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
