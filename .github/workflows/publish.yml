name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The monthly publications update commits with GITHUB_TOKEN, which never starts a
  # push-triggered run; deploy after it completes instead.
  workflow_run:
    workflows: ["Update Publications"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so CI renders with the same Typst as the local machine.
          # Unpinned, this tracks the latest release and the CV layout drifts
          # away from the locally previewed version. Bump together with the
          # local install.
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("yaml", "knitr", "rmarkdown"))'

      - name: Render site
        run: quarto render

      - name: Render CV PDFs
        run: cd cv && quarto render

      # The unlisted pages under apps/ are static files copied through by the
      # `resources:` key in _quarto.yml. Nothing links to them, so if an entry
      # is ever dropped the build still succeeds and the URL just starts
      # returning 404 with no other symptom. Equally, if one ever got pulled
      # into `render:` it would silently enter the sitemap and search index and
      # stop being unlisted. Assert both directions here, for every such page.
      # apps/babar-kuchen is temporary (Kita bake sale, 2026-11-24): remove it
      # from this list together with its folder and _quarto.yml entry.
      - name: Check the unlisted pages shipped correctly
        run: |
          set -euo pipefail

          for app in apps/practice apps/babar-kuchen; do
            # Every file must ship, byte-identical, and nothing extra may
            # appear. The pages are split across several files; a missing
            # sibling gives a blank or unstyled page rather than an obvious error.
            if [ ! -d "_site/$app" ]; then
              echo "::error::_site/$app is missing. Is the '$app/' entry still under project.resources in _quarto.yml?"
              exit 1
            fi
            if ! diff -rq "$app" "_site/$app"; then
              echo "::error::$app and _site/$app differ. Every file must be copied verbatim, never rendered by Quarto."
              exit 1
            fi
            n_files=$(find "$app" -type f | wc -l | tr -d ' ')

            # A page is useless if it stops referencing its siblings: every local
            # href/src in every HTML file must name a file that exists.
            for page in "$app"/*.html; do
              for ref in $(grep -o -E '(href|src)="[^"/:]+"' "$page" | sed -E 's/^(href|src)="//; s/"$//' | sed 's/[?#].*//'); do
                if [ ! -f "$app/$ref" ]; then
                  echo "::error::$page references $ref, which does not exist in $app/"
                  exit 1
                fi
              done
            done
            for index in sitemap.xml search.json; do
              if [ -f "_site/$index" ] && grep -q "$app" "_site/$index"; then
                echo "::error::$app appears in _site/$index. This page is meant to stay unlisted."
                exit 1
              fi
            done
            echo "$app: all $n_files files present, byte-identical to source, cross-referenced, absent from sitemap.xml and search.json"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
