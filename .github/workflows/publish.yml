name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so CI renders with the same Typst as the local machine.
          # Unpinned, this tracks the latest release and the CV layout drifts
          # away from the locally previewed version. Bump together with the
          # local install.
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("yaml", "knitr", "rmarkdown"))'

      - name: Render site
        run: quarto render

      - name: Render CV PDFs
        run: cd cv && quarto render

      # The practice page is an unlisted static file copied through by the
      # `resources:` key in _quarto.yml. Nothing links to it, so if that entry
      # is ever dropped the build still succeeds and the URL just starts
      # returning 404 with no other symptom. Equally, if it ever got pulled
      # into `render:` it would silently enter the sitemap and search index and
      # stop being unlisted. Assert both directions here.
      - name: Check the unlisted practice page shipped correctly
        run: |
          set -euo pipefail

          # index.html, app.css and app.js must all ship, byte-identical. The page
          # is split across three files; a missing sibling gives a blank or
          # unstyled page rather than an obvious error.
          for f in index.html app.css app.js; do
            src="apps/practice/$f"
            out="_site/apps/practice/$f"
            if [ ! -f "$src" ]; then
              echo "::error::$src is missing from the source tree."
              exit 1
            fi
            if [ ! -f "$out" ]; then
              echo "::error::$out is missing. Is the 'apps/practice/' entry still under project.resources in _quarto.yml?"
              exit 1
            fi
            if ! cmp -s "$src" "$out"; then
              echo "::error::$out differs from its source. It must be copied verbatim, never rendered by Quarto."
              exit 1
            fi
          done

          # The page is useless if index.html stops referencing its siblings.
          for ref in 'href="app.css"' 'src="app.js"'; do
            if ! grep -q "$ref" apps/practice/index.html; then
              echo "::error::apps/practice/index.html no longer contains $ref"
              exit 1
            fi
          done
          for index in sitemap.xml search.json; do
            if [ -f "_site/$index" ] && grep -q "apps/practice" "_site/$index"; then
              echo "::error::apps/practice appears in _site/$index. This page is meant to stay unlisted."
              exit 1
            fi
          done
          echo "practice page: all 3 files present, byte-identical to source, cross-referenced, absent from sitemap.xml and search.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
